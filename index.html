    <script>
      // 底层修复 v3：拦截 video 的 play 方法和 muted 属性，确保任何播放都是静音的
      (function() {
        try {
          var proto = HTMLMediaElement.prototype;
          var originalPlay = proto.play;
          var originalLoad = proto.load;

          // 重写 play 方法：播放前强制静音
          proto.play = function() {
            try {
              this.muted = true;
              this.setAttribute('muted', 'muted');
              this.playsInline = true;
              this.setAttribute('playsinline', 'playsinline');
              this.setAttribute('webkit-playsinline', 'webkit-playsinline');
            } catch(e) {}
            return originalPlay.apply(this, arguments);
          };

          // 重写 load 方法：加载前强制静音
          proto.load = function() {
            try {
              this.muted = true;
              this.setAttribute('muted', 'muted');
            } catch(e) {}
            return originalLoad.apply(this, arguments);
          };

          // 拦截 muted 属性：永远返回 true，设置时也强制 true
          try {
            var mutedProp = Object.getOwnPropertyDescriptor(proto, 'muted');
            if (mutedProp && mutedProp.configurable) {
              Object.defineProperty(proto, 'muted', {
                configurable: true,
                get: function() { return true; },
                set: function(v) { /* 强制静音，忽略设置 */ }
              });
            }
          } catch(e) {}

          // 拦截 autoplay 属性
          try {
            var autoplayProp = Object.getOwnPropertyDescriptor(proto, 'autoplay');
            if (autoplayProp && autoplayProp.configurable) {
              Object.defineProperty(proto, 'autoplay', {
                configurable: true,
                get: function() { return true; },
                set: function(v) { /* 允许设置，但播放时会强制静音 */ }
              });
            }
          } catch(e) {}
        } catch(e) {}
      })();
    </script>

    <div id="root"></div>
    <script>
      // 移动端视频兼容修复 v2 - 多重保障确保所有视频可播放
      (function() {
        var fixedCount = 0;

        function forceFixVideo(video) {
          try {
            video.muted = true;
            video.setAttribute('muted', 'muted');
            video.defaultMuted = true;
            video.playsInline = true;
            video.setAttribute('playsinline', 'playsinline');
            video.setAttribute('webkit-playsinline', 'webkit-playsinline');
            video.setAttribute('x5-playsinline', 'x5-playsinline');
            video.preload = 'auto';
            video.dataset.mobileFixed = 'v3';
            fixedCount++;

            var tryPlay = function() {
              try {
                video.muted = true;
                var p = video.play();
                if (p && p.catch) { p.catch(function(){}); }
              } catch(e) {}
            };

            if (video.readyState >= 1) {
              tryPlay();
            } else {
              video.addEventListener('loadedmetadata', tryPlay, { once: true });
              video.addEventListener('canplay', tryPlay, { once: true });
            }

            video.addEventListener('play', function() { video.muted = true; });
            video.addEventListener('playing', function() { video.muted = true; });
          } catch(e) {}
        }

        function scanAndFix() {
          var videos = document.querySelectorAll('video');
          videos.forEach(function(v) { forceFixVideo(v); });
          return videos.length;
        }

        scanAndFix();

        var observer = new MutationObserver(function(mutations) {
          var found = false;
          mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
              if (node.tagName === 'VIDEO') { found = true; }
              else if (node.querySelectorAll) {
                if (node.querySelectorAll('video').length > 0) found = true;
              }
            });
          });
          if (found) {
            setTimeout(scanAndFix, 50);
            setTimeout(scanAndFix, 200);
            setTimeout(scanAndFix, 500);
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        document.addEventListener('click', function() {
          setTimeout(scanAndFix, 100);
          setTimeout(scanAndFix, 300);
          setTimeout(scanAndFix, 600);
          setTimeout(scanAndFix, 1000);
        }, true);

        var checkCount = 0;
        var interval = setInterval(function() {
          scanAndFix();
          checkCount++;
          if (checkCount >= 60) {
            clearInterval(interval);
            var slowInterval = setInterval(function() {
              scanAndFix();
              if (checkCount >= 120) clearInterval(slowInterval);
              checkCount++;
            }, 2000);
          }
        }, 500);

        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) {
            setTimeout(scanAndFix, 100);
            setTimeout(scanAndFix, 500);
          }
        });

        window.fixAllVideos = scanAndFix;
      })();
    </script>

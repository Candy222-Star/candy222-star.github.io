    <script>
      // 底层修复：拦截 video 的 play 方法和 muted 属性
      (function() {
        try {
          var proto = HTMLMediaElement.prototype;
          var originalPlay = proto.play;
          proto.play = function() {
            try {
              this.muted = true;
              this.setAttribute('muted', 'muted');
              this.playsInline = true;
              this.setAttribute('playsinline', 'playsinline');
              this.setAttribute('webkit-playsinline', 'webkit-playsinline');
            } catch(e) {}
            return originalPlay.apply(this, arguments);
          };
          try {
            var mutedProp = Object.getOwnPropertyDescriptor(proto, 'muted');
            if (mutedProp && mutedProp.configurable) {
              Object.defineProperty(proto, 'muted', {
                configurable: true,
                get: function() { return true; },
                set: function(v) {}
              });
            }
          } catch(e) {}
        } catch(e) {}
      })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      // v5：在视频作品卡片上直接添加超链接播放按钮
      (function() {
        var processedCards = new WeakSet();

        // 从封面图URL推断视频URL
        function getVideoUrlFromPoster(posterSrc) {
          if (!posterSrc) return null;
          // /media/posters/xxx.jpg -> /media/videos/xxx.mp4
          var videoUrl = posterSrc
            .replace('/media/posters/', '/media/videos/')
            .replace(/\.jpg$/, '.mp4')
            .replace(/\.jpeg$/, '.mp4')
            .replace(/\.png$/, '.mp4');
          if (videoUrl.startsWith('/')) {
            videoUrl = window.location.origin + videoUrl;
          }
          return videoUrl;
        }

        // 给视频作品卡片添加直接播放按钮
        function addCardPlayButton(card) {
          if (!card || processedCards.has(card)) return;

          // 找到封面图
          var posterImg = card.querySelector('img.mp-poster') || card.querySelector('img');
          if (!posterImg || !posterImg.src) return;

          var videoUrl = getVideoUrlFromPoster(posterImg.src);
          if (!videoUrl) return;

          // 确保卡片是相对定位
          var cardPosition = window.getComputedStyle(card).position;
          if (cardPosition === 'static') {
            card.style.position = 'relative';
          }

          // 创建直接播放按钮
          var btn = document.createElement('a');
          btn.href = videoUrl;
          btn.target = '_blank';
          btn.rel = 'noopener noreferrer';
          btn.className = 'card-direct-play-btn';
          btn.innerHTML = '▶ 点击播放视频';
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            // 让默认行为打开新窗口
          });

          card.appendChild(btn);
          processedCards.add(card);
        }

        // 扫描所有视频作品卡片
        function scanCards() {
          // 视频作品卡片有 .media-play 类
          var cards = document.querySelectorAll('.media-play, button[aria-label="播放视频"]');
          cards.forEach(function(card) {
            addCardPlayButton(card);
          });

          // 同时处理模态框里的视频
          var videos = document.querySelectorAll('video');
          videos.forEach(function(video) {
            if (video.src && !video.dataset.modalBtnAdded) {
              video.dataset.modalBtnAdded = 'true';
              var container = video.closest('.video-player') || video.parentElement;
              if (container && !container.querySelector('.mobile-video-direct-btn')) {
                var videoUrl = video.src;
                if (videoUrl.startsWith('/')) {
                  videoUrl = window.location.origin + videoUrl;
                }
                var btn = document.createElement('a');
                btn.href = videoUrl;
                btn.target = '_blank';
                btn.rel = 'noopener noreferrer';
                btn.className = 'mobile-video-direct-btn';
                btn.innerHTML = '▶ 点击在新窗口播放视频（推荐）';
                var tip = document.createElement('p');
                tip.className = 'mobile-video-tip';
                tip.textContent = '如内嵌播放失败，请点击上方按钮用浏览器原生播放器打开';
                container.insertBefore(tip, video);
                container.insertBefore(btn, tip);
              }
              try {
                video.muted = true;
                var p = video.play();
                if (p && p.catch) { p.catch(function(){}); }
              } catch(e) {}
            }
          });
        }

        // 立即扫描
        scanCards();

        // MutationObserver 监听动态创建的卡片
        var observer = new MutationObserver(function(mutations) {
          var found = false;
          mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
              if (node.nodeType === 1) {
                if (node.classList && (node.classList.contains('media-play') || node.getAttribute('aria-label') === '播放视频')) {
                  found = true;
                }
                if (node.querySelectorAll) {
                  if (node.querySelectorAll('.media-play, video').length > 0) found = true;
                }
              }
            });
          });
          if (found) {
            setTimeout(scanCards, 50);
            setTimeout(scanCards, 200);
            setTimeout(scanCards, 500);
            setTimeout(scanCards, 1000);
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // 全局点击监听
        document.addEventListener('click', function() {
          setTimeout(scanCards, 100);
          setTimeout(scanCards, 300);
          setTimeout(scanCards, 600);
          setTimeout(scanCards, 1000);
          setTimeout(scanCards, 2000);
        }, true);

        // 定期检查
        var count = 0;
        var interval = setInterval(function() {
          scanCards();
          count++;
          if (count >= 120) clearInterval(interval);
        }, 1000);

        window.fixAllVideos = scanCards;
      })();
    </script>
